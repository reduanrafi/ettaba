name: Deploy Ettaba to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            if [ ! -d "/var/www/ettaba/.git" ]; then
              echo "Initializing git repository on VPS..."
              mkdir -p /var/www/ettaba
              cd /var/www/ettaba
              git clone https://github.com/reduanrafi/ettaba.git .
            fi
            chmod +x /var/www/ettaba/deploy/deploy_production.sh
            /var/www/ettaba/deploy/deploy_production.sh
